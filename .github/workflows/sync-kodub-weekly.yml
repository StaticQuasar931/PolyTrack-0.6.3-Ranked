name: Sync Kodub weekly fallback

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-kodub-weekly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture current weekly track
        run: node tools/sync-kodub-weekly.mjs
      - name: Commit changed capture
        run: |
          if git diff --quiet -- events/kodub; then
            echo "Kodub weekly fallback is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events/kodub
          git commit -m "Sync Kodub weekly fallback"
          git push
