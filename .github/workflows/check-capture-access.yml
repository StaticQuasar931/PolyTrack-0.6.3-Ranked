name: Check private snapshot access
on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        description: Exact tested main commit
        type: string
        required: true
      recipient_public_key:
        description: Optional public RSA key for an encrypted issuer identity
        type: string
        required: false
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'StaticQuasar931/PolyTrack-0.6.3-Ranked' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: polytrack-capture-access-preflight
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check exact tested source
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
      - name: Test zero-data diagnosis
        run: node --test tools/capture-access-diagnostics.test.mjs tools/worker-capture-fetch.test.mjs tools/check-worker-capture-access.test.mjs
      - name: Check private access without database requests
        env:
          FIREBASE_VERIFIER_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_VERIFIER_SERVICE_ACCOUNT }}
          CAPTURE_DIAGNOSTIC_RECIPIENT_KEY: ${{ inputs.recipient_public_key }}
        run: node tools/capture-access-diagnostics.mjs
