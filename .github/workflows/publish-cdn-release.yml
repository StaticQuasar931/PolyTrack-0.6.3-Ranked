name: Publish CDN release

on:
  push:
    branches: [main]
  schedule:
    # CDN-only recovery for delayed alias freshness; never recapture Firebase data.
    - cron: '13,28,43,58 * * * *'
  workflow_call:
    outputs:
      cdn_status:
        description: 'CDN publication outcome: confirmed at checking edge, deferred, or superseded'
        value: ${{ jobs.publish.outputs.cdn_status }}
    inputs:
      refresh_only:
        description: 'Refresh the published CDN release without rebuilding assets'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      refresh_only:
        description: 'Refresh the published CDN release without rebuilding assets'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  publish:
    outputs:
      cdn_status: ${{ steps.publication.outputs.cdn_status }}
    if: github.repository == 'StaticQuasar931/PolyTrack-0.6.3-Ranked' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: polytrack-cdn-release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # This runs after capture pushes, not against the caller's older checkout.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # Optional provider cooldown metadata only. Never cache credentials or repository contents.
      - name: Restore CDN pointer purge cooldown
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v4.2.3
        with:
          path: ${{ runner.temp }}/polytrack-cdn-purge/state.json
          key: cdn-pointer-purge-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cdn-pointer-purge-v1-${{ github.repository_id }}-
      - name: Validate workflow syntax
        # Official pinned validator, verified before execution. No Firebase access.
        run: |
          TOOL_DIR="$RUNNER_TEMP/polytrack-actionlint-1.7.12"
          mkdir -p "$TOOL_DIR"
          curl --fail --location --retry 2 --connect-timeout 10 --max-time 60 --output "$TOOL_DIR/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$TOOL_DIR/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$TOOL_DIR/actionlint.tar.gz" -C "$TOOL_DIR" actionlint
          "$TOOL_DIR/actionlint" -no-color -shellcheck= -pyflakes=
      - name: Check Help release information
        run: node tools/check-release-info.mjs
      - name: Test CDN publication safeguards
        run: node --test tools/publish-cdn-release.test.mjs tools/workflow-release-contract.test.mjs
      - name: Validate immutable assets, publish pointer, and confirm CDN refresh
        id: publication
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CDN_REFRESH_ONLY: ${{ (github.event_name == 'schedule' || inputs.refresh_only == true) && 'true' || 'false' }}
          CDN_PURGE_STATE_FILE: ${{ runner.temp }}/polytrack-cdn-purge/state.json
        run: |
          if [ "$CDN_REFRESH_ONLY" = "true" ]; then
            node tools/publish-cdn-release.mjs --refresh-only
          else
            node tools/publish-cdn-release.mjs
          fi
      - name: Save CDN pointer purge cooldown
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v4.2.3
        with:
          path: ${{ runner.temp }}/polytrack-cdn-purge/state.json
          key: cdn-pointer-purge-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
