name: Sync public event catalog fallback

on:
  schedule:
    - cron: '30 10 * * *'
    - cron: '10 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-public-event-catalog
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'StaticQuasar931/PolyTrack-0.6.3-Ranked'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture public event assignments
        run: node tools/sync-event-catalog.mjs
      - name: Capture bounded public snapshots
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 10 * * *'
        run: node tools/public-snapshot-backup.mjs
      - name: Commit changed assignments
        run: |
          git add -- events/public-catalog.json
          if [ -d public-snapshots ]; then
            git add -- public-snapshots
          fi
          if git diff --cached --quiet -- events/public-catalog.json public-snapshots; then
            echo "Public static backups are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync public ranked snapshots"
          git push
