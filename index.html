  <body>
    <canvas id="screen"></canvas>
    <div id="ui"></div>
    <div id="transition-layer"></div>

    <div id="staticMenu" role="region" aria-label="StaticQuasar menu">
      <a href="https://sites.google.com/view/staticquasar931/gm3z" target="_blank" rel="noopener">STATIC / GAMES</a>
    </div>

    <script>
      window.addEventListener('beforeunload', (event) => {
        if (!window.__polytrackMultiplayerSessionActive) return;
        event.preventDefault();
        event.returnValue = '';
      });

      (function(){
        const idsToToggle = ["staticMenu"];
        let seq = [];
        const target = ["y","u","i"];
        function toggle(){
          idsToToggle.forEach(id => {
            const el = document.getElementById(id);
            if(!el) return;
            const isHidden = (el.style.display === "none" || getComputedStyle(el).display === "none");
            el.style.display = isHidden ? "flex" : "none";
          });
        }
        window.addEventListener("keydown", e => {
          seq.push(String(e.key || "").toLowerCase());
          if (seq.length > 3) seq.shift();
          if (seq.join("") === target.join("")) toggle();
        });
      })();
    </script>

    <noscript>PolyTrack 0.6.3 Ranked requires JavaScript. Race 17 official and 71 bundled community tracks, save personal best replays, and compete in StaticQuasar931 community rankings.</noscript>
    <script>
      (function(){
        const menu = document.getElementById('staticMenu');
        if (!menu) return;

        function isVisible(el){
          if (!el) return false;
          const style = getComputedStyle(el);
          if (style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity || '1') < 0.05) return false;
          const rect = el.getBoundingClientRect();
          return rect.width > 20 && rect.height > 20;
        }

        function inLobby(){
          const menuRoot = document.querySelector('.menu-ui, .menu');
          const mainButtons = document.querySelector('.main-buttons-container');
          const play = mainButtons && Array.from(mainButtons.querySelectorAll('button,a')).find((button)=>/play/i.test(`${button.textContent||''} ${Array.from(button.querySelectorAll('img')).map((image)=>image.src||'').join(' ')}`));
          return isVisible(menuRoot) && isVisible(mainButtons) && isVisible(play);
        }

        const uiRoot = document.getElementById('ui');
        let syncQueued = false;
        let visualObserver;

        function syncLobbyWidgets(){
          const lobby = inLobby();
          const display = lobby ? 'flex' : 'none';
          if (menu.style.display !== display) menu.style.display = display;
        }

        function queueSync(){
          if (syncQueued) return;
          syncQueued = true;
          const flush = () => {
            syncQueued = false;
            syncLobbyWidgets();
            bindVisualObserver();
          };
          requestAnimationFrame(flush);
        }

        function bindVisualObserver(){
          if (!visualObserver) return;
          visualObserver.disconnect();
          [document.querySelector('.menu-ui, .menu'), document.querySelector('.main-buttons-container')]
            .filter(Boolean)
            .forEach((target) => visualObserver.observe(target, {
              subtree: true,
              attributes: true,
              attributeFilter: ['class', 'style', 'hidden', 'aria-hidden']
            }));
        }

        syncLobbyWidgets();
        const structureObserver = new MutationObserver(queueSync);
        structureObserver.observe(uiRoot || document.body, {
          subtree: true,
          childList: true
        });
        visualObserver = new MutationObserver(queueSync);
        bindVisualObserver();
        window.addEventListener('focus', queueSync);
        window.addEventListener('sq-preferences-changed', queueSync);
      })();
    </script>
